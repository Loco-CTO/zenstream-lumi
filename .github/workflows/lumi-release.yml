name: Lumi release

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Package tests (Python ${{ matrix.python }} on ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", target: windows-x64, runner: windows-latest }
          - { python: "3.13", target: windows-x64, runner: windows-latest }
          - { python: "3.14", target: windows-x64, runner: windows-latest }
          - { python: "3.12", target: linux-x64, runner: ubuntu-24.04 }
          - { python: "3.13", target: linux-x64, runner: ubuntu-24.04 }
          - { python: "3.14", target: linux-x64, runner: ubuntu-24.04 }
          - { python: "3.12", target: linux-arm64, runner: ubuntu-24.04-arm }
          - { python: "3.13", target: linux-arm64, runner: ubuntu-24.04-arm }
          - { python: "3.14", target: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Check out Lumi
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package test dependencies
        run: python -m pip install -e ".[dev,service]"
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/build_release.py --tag "${GITHUB_REF_NAME}" --check-tag
        shell: bash
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check lint
        run: ruff check lumi tests scripts
      - name: Compile package and release script
        run: python -m compileall -q lumi scripts tests

  # llama-cpp-python ships a py3-none wheel with ctypes-loaded native libraries.
  # Build once per platform, then validate the wheel under every Python version below.
  native-windows:
    name: Build CUDA and Vulkan runtime wheel (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      # Keep a generic PTX fallback plus native targets for common
      # modern GPUs. Extra CUDA images made wheel builds spend hours in nvcc;
      # Vulkan remains the broad cross-vendor path.
      CMAKE_ARGS: >-
        -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DGGML_BACKEND_DL=OFF
        -DGGML_CUDA=ON -DGGML_VULKAN=ON
        -DCMAKE_CUDA_ARCHITECTURES=50-virtual;89-real;120a-real
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - name: Check out Lumi
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned CUDA build components
        shell: pwsh
        run: ./scripts/install_cuda_redist_windows.ps1
      - name: Install the pinned Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@3c53c378c9bfbb2ea122a1cc164a837d4004c871 # v1.5.2
        with:
          vulkan_version: "1.4.309.0"
          install_runtime: true
          stripdown: true
      - name: Install the SPIR-V headers required by the pinned Vulkan SDK
        shell: pwsh
        run: |
          $sourcePath = Join-Path $env:RUNNER_TEMP "SPIRV-Headers"
          $buildPath = Join-Path $env:RUNNER_TEMP "SPIRV-Headers-build"
          $installPath = Join-Path $env:RUNNER_TEMP "SPIRV-Headers-install"
          $expectedCommit = "09913f088a1197aba4aefd300a876b2ebbaa3391"

          git clone https://github.com/KhronosGroup/SPIRV-Headers.git $sourcePath
          git -C $sourcePath checkout --detach $expectedCommit
          $actualCommit = (git -C $sourcePath rev-parse HEAD).Trim()
          if ($actualCommit -ne $expectedCommit) {
            throw "Unexpected SPIRV-Headers commit: $actualCommit"
          }

          cmake -S $sourcePath -B $buildPath `
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF `
            -DSPIRV_HEADERS_ENABLE_INSTALL=ON `
            "-DCMAKE_INSTALL_PREFIX=$installPath"
          cmake --install $buildPath --config Release

          $configPath = Join-Path $installPath "share\cmake\SPIRV-Headers\SPIRV-HeadersConfig.cmake"
          if (-not (Test-Path $configPath)) {
            throw "SPIRV-Headers CMake package configuration was not installed"
          }

          $cmakePrefixPaths = @($installPath)
          if (-not [string]::IsNullOrWhiteSpace($env:CMAKE_PREFIX_PATH)) {
            $cmakePrefixPaths += $env:CMAKE_PREFIX_PATH
          }
          $cmakePrefixPath = $cmakePrefixPaths -join ";"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$cmakePrefixPath"

      - name: Check native GPU build tools
        shell: pwsh
        run: |
          nvcc --version
          if (-not $env:VULKAN_SDK) { throw "The pinned Vulkan SDK was not installed" }
          & "$env:VULKAN_SDK\Bin\glslc.exe" --version
      - name: Build the pinned CUDA and Vulkan llama.cpp runtime wheel
        run: >-
          python -m pip wheel
          --no-deps
          --no-binary=llama-cpp-python
          --wheel-dir dist/wheels/runtime
          "llama-cpp-python==0.3.35"
      - name: Bundle backend dependencies and verify GPU backends
        shell: pwsh
        run: |
          python -m pip install "delvewheel==1.13.1"
          delvewheel repair --analyze-existing --add-path "$env:CUDA_PATH\bin;$env:VULKAN_SDK\Bin" --exclude nvcuda.dll --wheel-dir dist/wheels/repaired dist/wheels/runtime/*.whl
          Remove-Item dist/wheels/runtime/*.whl
          Move-Item dist/wheels/repaired/*.whl dist/wheels/runtime/
          python -c "from pathlib import Path; from zipfile import ZipFile; p=next(Path('dist/wheels/runtime').glob('*.whl')); names=[name.casefold() for name in ZipFile(p).namelist()]; missing=[backend for backend in ('ggml-cpu','ggml-cuda','ggml-vulkan') if not any(backend in name for name in names)]; print('Wheel:', p.name); raise SystemExit(f'Missing required backends: {missing}' if missing else 0)"
      - name: Save the platform runtime wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llama-cpp-windows-x64
          path: dist/wheels/runtime/*.whl
          if-no-files-found: error
          retention-days: 1

  linux-vulkan-tools:
    name: Build pinned glslc for manylinux 2.28
    runs-on: ubuntu-24.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.03-1@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
    steps:
      - name: Check out Lumi
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build glslc from the pinned Shaderc release
        run: |
          manylinux_python=/opt/python/cp312-cp312/bin/python
          export PATH="$(dirname "$manylinux_python"):$PATH"
          "$manylinux_python" -m pip install "cmake==3.31.6"
          git clone --depth 1 --branch v2025.4 https://github.com/google/shaderc.git /tmp/shaderc
          test "$(git -C /tmp/shaderc rev-parse HEAD)" = "73743588fe9c39f2f1c780a087d94afac691a189"
          cd /tmp/shaderc
          "$manylinux_python" utils/git-sync-deps
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON
          cmake --build build --target glslc_exe --parallel 2
          build/glslc/glslc --version
          mkdir -p "$GITHUB_WORKSPACE/dist/tools"
          cp build/glslc/glslc "$GITHUB_WORKSPACE/dist/tools/glslc"
      - name: Save the pinned shader compiler
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-vulkan-glslc
          path: dist/tools/glslc
          if-no-files-found: error
          retention-days: 1

  native-linux:
    name: Build runtime wheel (${{ matrix.target }})
    needs: [linux-vulkan-tools]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    timeout-minutes: 45
    env:
      CMAKE_ARGS: >-
        -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DGGML_BACKEND_DL=OFF
        -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      CXXFLAGS: -static-libstdc++
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, container: quay.io/pypa/manylinux_2_28_x86_64:2026.10.03-1@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82, platform: manylinux_2_28_x86_64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, container: quay.io/pypa/manylinux_2_28_aarch64:2026.10.03-1@sha256:f5f03dedf61b47d69d0742d36047db78adeee3bdb7a9910ff52304750ecf2514, platform: manylinux_2_28_aarch64 }
    steps:
      - name: Check out Lumi
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download the pinned Linux Vulkan shader compiler
        if: matrix.target == 'linux-x64'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: linux-vulkan-glslc
          path: build-tools
      - name: Install platform build dependencies, build, and repair the llama.cpp runtime wheel
        run: |
          dnf install -y dnf-plugins-core gcc-c++
          dnf config-manager --set-enabled powertools
          dnf install -y libstdc++-static
          PYTHON=/opt/python/cp312-cp312/bin/python
          export PATH="$(dirname "$PYTHON"):$PATH"
          if [[ "${{ matrix.target }}" == "linux-x64" ]]; then
            rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf install -y cuda-toolkit-12-8-12.8.1-1
            dnf install -y epel-release-8-22.el8
            dnf install -y \
              vulkan-headers-1.3.283.0-1.el8_10 \
              vulkan-loader-devel-1.3.283.0-1.el8_10 \
              spirv-headers-devel-1.5.4-7.20210728.git449bc98.el8
            "$PYTHON" -m pip install "cmake==3.31.6"
            SPIRV_HEADERS_SOURCE_DIR=/tmp/spirv-headers
            SPIRV_HEADERS_PREFIX=/opt/spirv-headers
            git init "$SPIRV_HEADERS_SOURCE_DIR"
            git -C "$SPIRV_HEADERS_SOURCE_DIR" remote add origin https://github.com/KhronosGroup/SPIRV-Headers.git
            git -C "$SPIRV_HEADERS_SOURCE_DIR" fetch --depth 1 origin 449bc986ba6f4c5e10e32828783f9daef2a77644
            git -C "$SPIRV_HEADERS_SOURCE_DIR" checkout --detach FETCH_HEAD
            test "$(git -C "$SPIRV_HEADERS_SOURCE_DIR" rev-parse HEAD)" = "449bc986ba6f4c5e10e32828783f9daef2a77644"
            cmake -S "$SPIRV_HEADERS_SOURCE_DIR" -B "$SPIRV_HEADERS_SOURCE_DIR/build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$SPIRV_HEADERS_PREFIX" \
              -DSPIRV_HEADERS_SKIP_EXAMPLES=ON \
              -DSPIRV_HEADERS_SKIP_INSTALL=OFF
            cmake --build "$SPIRV_HEADERS_SOURCE_DIR/build" --parallel 2
            cmake --install "$SPIRV_HEADERS_SOURCE_DIR/build"
            test -f "$SPIRV_HEADERS_PREFIX/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
            chmod +x build-tools/glslc
            build-tools/glslc --version
            export CUDA_HOME=/usr/local/cuda-12.8
            export CUDACXX="$CUDA_HOME/bin/nvcc"
            export PATH="$CUDA_HOME/bin:$PATH"
            export LD_LIBRARY_PATH="$CUDA_HOME/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            CMAKE_ARGS="$CMAKE_ARGS -DGGML_CUDA=ON -DGGML_VULKAN=ON -DCMAKE_CUDA_ARCHITECTURES=50-virtual;89-real;120a-real -DVulkan_GLSLC_EXECUTABLE=$PWD/build-tools/glslc -DSPIRV-Headers_DIR=$SPIRV_HEADERS_PREFIX/share/cmake/SPIRV-Headers"
          else
            CMAKE_ARGS="$CMAKE_ARGS -DGGML_CUDA=OFF -DGGML_VULKAN=OFF"
          fi
          export CMAKE_ARGS
          "$CC" --version
          "$CXX" --version
          if [[ "${{ matrix.target }}" == "linux-x64" ]]; then
            nvcc --version
            build-tools/glslc --version
          fi
          "$PYTHON" -m pip wheel --no-deps --no-binary=llama-cpp-python --wheel-dir dist/wheels/runtime "llama-cpp-python==0.3.35"
          mkdir -p dist/wheels/expanded
          "$PYTHON" -m zipfile -e dist/wheels/runtime/*.whl dist/wheels/expanded
          NATIVE_LIB_DIR="$PWD/dist/wheels/expanded/llama_cpp/lib"
          test -d "$NATIVE_LIB_DIR"
          NATIVE_LIBS="$(find "$NATIVE_LIB_DIR" -maxdepth 1 -name 'libggml*.so*' -print)"
          test -n "$NATIVE_LIBS"
          printf '%s\n' "$NATIVE_LIBS"
          printf '%s\n' "$NATIVE_LIBS" | grep -q 'libggml-cpu'
          if [[ "${{ matrix.target }}" == "linux-x64" ]]; then
            printf '%s\n' "$NATIVE_LIBS" | grep -q 'libggml-cuda'
            printf '%s\n' "$NATIVE_LIBS" | grep -q 'libggml-vulkan'
            LD_LIBRARY_PATH="$NATIVE_LIB_DIR:/usr/local/cuda/lib64:/usr/lib64:/usr/lib" auditwheel show dist/wheels/runtime/*.whl
            LD_LIBRARY_PATH="$NATIVE_LIB_DIR:/usr/local/cuda/lib64:/usr/lib64:/usr/lib" auditwheel repair --exclude libcuda.so.1 --plat "${{ matrix.platform }}" --wheel-dir dist/wheels/repaired dist/wheels/runtime/*.whl
          else
            LD_LIBRARY_PATH="$NATIVE_LIB_DIR:/usr/lib64:/usr/lib" auditwheel show dist/wheels/runtime/*.whl
            LD_LIBRARY_PATH="$NATIVE_LIB_DIR:/usr/lib64:/usr/lib" auditwheel repair --plat "${{ matrix.platform }}" --wheel-dir dist/wheels/repaired dist/wheels/runtime/*.whl
          fi
          rm dist/wheels/runtime/*.whl
          mv dist/wheels/repaired/*.whl dist/wheels/runtime/
          unzip -Z1 dist/wheels/runtime/*.whl | grep -q 'llama_cpp/lib/libggml-cpu'
          if [[ "${{ matrix.target }}" == "linux-x64" ]]; then
            unzip -Z1 dist/wheels/runtime/*.whl | grep -q 'llama_cpp/lib/libggml-cuda'
            unzip -Z1 dist/wheels/runtime/*.whl | grep -q 'llama_cpp/lib/libggml-vulkan'
          fi
      - name: Save the platform runtime wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: llama-cpp-${{ matrix.target }}
          path: dist/wheels/runtime/*.whl
          if-no-files-found: error
          retention-days: 1

  release-wheels:
    name: Build dependency wheelhouse (Python ${{ matrix.python }} on ${{ matrix.target }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [tests, native-windows, native-linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", target: windows-x64, runner: windows-latest }
          - { python: "3.13", target: windows-x64, runner: windows-latest }
          - { python: "3.14", target: windows-x64, runner: windows-latest }
          - { python: "3.12", target: linux-x64, runner: ubuntu-24.04 }
          - { python: "3.13", target: linux-x64, runner: ubuntu-24.04 }
          - { python: "3.14", target: linux-x64, runner: ubuntu-24.04 }
          - { python: "3.12", target: linux-arm64, runner: ubuntu-24.04-arm }
          - { python: "3.13", target: linux-arm64, runner: ubuntu-24.04-arm }
          - { python: "3.14", target: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Check out Lumi
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the shared platform llama.cpp runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: llama-cpp-${{ matrix.target }}
          path: dist/wheels/runtime
      - name: Download pinned runtime dependencies
        run: >-
          python -m pip download
          --only-binary=:all:
          --dest dist/wheels/runtime
          "click==8.5.0"
          "ddgs==9.16.0"
          "diskcache==5.6.3"
          "jinja2==3.1.6"
          "lxml==6.1.3"
          "numpy==2.5.3"
          "primp==2.0.1"
          "typing_extensions==4.16.0"
      - name: Download pinned CPU model installer wheels and their dependencies
        run: >-
          python -m pip download
          --only-binary=:all:
          --dest dist/wheels/installer
          "huggingface-hub==1.10.0"
      - name: Smoke-test CPU registry and GPU wheel shape with device-aware checks
        run: >-
          python scripts/smoke_llama_cpp_wheel.py
          --wheelhouse dist/wheels/runtime
          --wheelhouse dist/wheels/installer
          ${{ matrix.target != 'linux-arm64' && '--require-backend cuda --require-backend vulkan' || '' }}
      - name: Save wheelhouse artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.target }}
          path: dist/wheels/**/*.whl
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Lumi GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-wheels
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged Lumi source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download platform runtime wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: llama-cpp-*
          path: build/wheels/runtime
      - name: Download all platform dependency wheelhouses
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheels-*
          path: build/wheels
      - name: Create the verified Lumi release archive
        run: python scripts/build_release.py --tag "${GITHUB_REF_NAME}" --wheelhouse build/wheels --output dist/release
      - name: Publish stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/release/lumi-runtime.zip
          dist/release/*.whl
          --verify-tag
          --generate-notes
          --title "Lumi ${GITHUB_REF_NAME}"

