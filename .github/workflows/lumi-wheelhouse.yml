name: Lumi dependency wheelhouse

on:
  workflow_call:
    inputs:
      targets:
        description: JSON array of platform names and runner labels
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-wheels:
    name: Build dependency wheelhouse (Python ${{ matrix.python }} on ${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Check out Lumi
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Download the shared platform llama.cpp runtime wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: llama-cpp-${{ matrix.target.name }}
          path: dist/wheels/runtime
      - name: Download pinned runtime dependencies
        run: >-
          python -m pip download
          --only-binary=:all:
          --dest dist/wheels/runtime
          "click==8.5.0"
          "ddgs==9.16.0"
          "diskcache==5.6.3"
          "jinja2==3.1.6"
          "lxml==6.1.3"
          "numpy==2.5.3"
          "primp==2.0.1"
          "typing_extensions==4.16.0"
      - name: Download pinned CPU model installer wheels and their dependencies
        run: >-
          python -m pip download
          --only-binary=:all:
          --dest dist/wheels/installer
          "huggingface-hub==1.10.0"
      - name: Smoke-test CPU registry and GPU wheel shape with device-aware checks
        run: >-
          python scripts/smoke_llama_cpp_wheel.py
          --wheelhouse dist/wheels/runtime
          --wheelhouse dist/wheels/installer
          ${{ matrix.target.name != 'linux-arm64' && '--require-backend cuda --require-backend vulkan' || '' }}
      - name: Remove the separately published native runtime wheel from the dependency wheelhouse
        run: >-
          python -c "from pathlib import Path; wheels = list(Path('dist/wheels/runtime').glob('llama_cpp_python-*.whl')); assert len(wheels) == 1, f'Expected one native runtime wheel, found {len(wheels)}'; wheels[0].unlink()"
      - name: Save wheelhouse artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.python }}-${{ matrix.target.name }}
          path: dist/wheels/**/*.whl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # Wheel files are already compressed
