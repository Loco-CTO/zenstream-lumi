[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zenstream-lumi"
version = "0.1.0"
description = "Local, read-only conversational media assistant for ZenStream"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ZenStream contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.13"]
service = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.34",
]
embedded = ["onnxruntime-genai==0.17.1"]

[tool.setuptools.packages.find]
include = ["lumi*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
