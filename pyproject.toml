[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zenstream-lumi"
version = "0.3.10"
description = "Local, read-only conversational media assistant for ZenStream"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ZenStream contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.13"]
service = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.34",
]
embedded = [
    "click==8.5.0",
    "ddgs==9.16.0",
    "diskcache==5.6.3",
    "jinja2==3.1.6",
    "llama-cpp-python==0.3.35",
    "lxml==6.1.3",
    "numpy==2.5.3",
    "primp==2.0.1",
    "typing_extensions==4.16.0",
]
model-install = ["huggingface-hub==1.10.0"]

[tool.setuptools.packages.find]
include = ["lumi*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.lumi.release]
runtime-api-version = 1
minimum-orchestrator-version = "1.7.3"
maximum-orchestrator-version-exclusive = "2.0.0"
runtime-distributions = ["click", "ddgs", "diskcache", "jinja2", "llama-cpp-python", "lxml", "numpy", "primp", "typing_extensions"]
runtime-native-distributions = ["llama-cpp-python"]
installer-distributions = ["huggingface-hub"]
# Bump the target ID when its llama.cpp source, toolchain, SDK pins, backend flags,
# architecture list, or manylinux baseline changes. Releases reuse only wheels
# whose recorded ID matches this contract.
native-runtime-bootstrap-tag = "v0.3.8"

[tool.lumi.release.native-runtime-build-ids]
"windows-x64" = "llama-cpp-python-0.3.35-msvc2022-cuda12.8-vulkan1.4.309-sm75-virtual-sm86-real-v1"
"linux-x64" = "llama-cpp-python-0.3.35-manylinux2026.10.03-1-gcc-cuda12.8-vulkan-spirv449bc9-shaderc73743588-sm75-virtual-sm86-real-v1"
"linux-arm64" = "llama-cpp-python-0.3.35-manylinux2026.10.03-1-aarch64-gcc-cpu-only-v1"

# v0.3.8 predates native build IDs, so reuse is allowed only while each target
# still matches the exact build contract used to create that release's wheels.
[tool.lumi.release.native-runtime-bootstrap-build-ids]
"windows-x64" = "llama-cpp-python-0.3.35-msvc2022-cuda12.8-vulkan1.4.309-sm75-virtual-sm86-real-v1"
"linux-x64" = "llama-cpp-python-0.3.35-manylinux2026.10.03-1-gcc-cuda12.8-vulkan-spirv449bc9-shaderc73743588-sm75-virtual-sm86-real-v1"
"linux-arm64" = "llama-cpp-python-0.3.35-manylinux2026.10.03-1-aarch64-gcc-cpu-only-v1"

