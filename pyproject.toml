[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zenstream-lumi"
version = "0.1.0"
description = "Local, read-only conversational media assistant for ZenStream"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ZenStream contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.13"]
service = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.34",
]
embedded = ["numpy==2.2.6", "onnxruntime-genai==0.17.1"]
model-install = [
    "huggingface-hub==1.10.0",
    "onnx-ir==0.2.1",
    "onnxruntime-genai==0.17.1",
    "torch==2.11.0+cpu",
    "transformers==5.2.0",
]

[tool.setuptools.packages.find]
include = ["lumi*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.lumi.release]
runtime-api-version = 1
minimum-orchestrator-version = "1.7.2"
maximum-orchestrator-version-exclusive = "2.0.0"
runtime-distributions = ["numpy", "onnxruntime-genai"]
installer-distributions = ["huggingface-hub", "onnx-ir", "torch", "transformers"]
